[workspace]
members = [
    "core",
    "desktop",
    "web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["onoderakeita"]
repository = "https://github.com/onoderakeita/openrustbooks"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
pulldown-cmark = { version = "0.12", features = ["simd"] }
comrak = { version = "0.28", features = ["default"] }
rumdl = { version = "0.2", default-features = true }
async-openai = "0.30"
tiktoken-rs = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1.5"
similar = "2.7.0"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "5.0"
toml = "0.8"
futures = "0.3"
async-trait = "0.1"
pretty_assertions = "1.4"
tokio-test = "0.4"