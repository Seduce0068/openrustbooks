[workspace]
resolver = "3"
members = [
    "core",
    "desktop",
    "web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["onoderakeita"]
repository = "https://github.com/Seduce0068/openrustbooks"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
pulldown-cmark = { version = "0.13", features = ["simd"] }
comrak = { version = "0.59", default-features = false }
rumdl = { version = "0.3", default-features = true }
async-openai = { version = "0.42", features = ["chat-completion"] }
tiktoken-rs = "0.12"
reqwest = { version = "0.13", features = ["json", "stream"] }
bytes = "1.5"
similar = "3.0"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "6.0"
toml = "1"
futures = "0.3"
async-trait = "0.1"
pretty_assertions = "1.4"
tokio-test = "0.4"