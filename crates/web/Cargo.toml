[package]
name = "openrustbooks-web"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Web application for openrustbooks (Wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workspace dependencies
openrustbooks-core = { path = "../core", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "Element", "HtmlElement",
    "Node", "EventTarget", "Blob", "File", "FileReader",
    "Url", "Performance", "HtmlInputElement", "HtmlTextAreaElement",
    "HtmlSelectElement", "HtmlButtonElement", "HtmlDivElement",
    "HtmlSpanElement", "HtmlAnchorElement", "HtmlTableElement",
    "HtmlTableRowElement", "HtmlTableCellElement", "HtmlHeadElement",
    "HtmlBodyElement", "HtmlScriptElement", "HtmlStyleElement",
    "Event", "MouseEvent", "KeyboardEvent", "InputEvent",
    "DragEvent", "FocusEvent", "ClipboardEvent", "SubmitEvent",
    "Storage", "History",
    "Location", "Navigator", "Screen", "MediaQueryList",
    "IntersectionObserver", "MutationObserver", "ResizeObserver",
    "Request", "Response", "Headers", "FormData",
    "FileReader", "UrlSearchParams", "DomParser",
    "XmlHttpRequest", "WebSocket", "MessageEvent", "CloseEvent",
    "ErrorEvent", "ProgressEvent"
] }
gloo = { version = "0.10", features = ["timers", "events", "storage", "console", "net", "utils", "file"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
serde-wasm-bindgen = "0.6"

# Frontend framework (Leptos)
leptos = { version = "0.7", features = ["csr", "nightly"] }
leptos_router = "0.7"
leptos-use = "0.7"

# Editor - CodeMirror 6 via wasm-bindgen (manual binding)

# Utilities
uuid = { version = "1.8", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"