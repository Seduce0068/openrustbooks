[package]
name = "openrustbooks-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Shared core library for openrustbooks: document models, I/O abstraction, AI Markdown pipeline"

[lib]
name = "openrustbooks_core"
crate-type = ["cdylib", "rlib"]  # cdylib for Wasm, rlib for native

[dependencies]
# Workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "fs", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
pulldown-cmark = { workspace = true }
comrak = { workspace = true }
rumdl = { workspace = true }
async-openai = { workspace = true }
tiktoken-rs = { workspace = true }
similar = { workspace = true }
figment = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }

# Additional core dependencies
url = "2.5"
walkdir = "2.5"
ignore = "0.4"
async-trait = "0.1"
once_cell = "1.19"
parking_lot = "0.12"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
toml = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "Blob", "File", "FileReader", "Url", "Performance", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlDivElement", "HtmlSpanElement", "HtmlAnchorElement", "Event", "MouseEvent", "KeyboardEvent", "InputEvent", "DragEvent", "FocusEvent", "ClipboardEvent", "SubmitEvent", "Storage", "History", "Location", "Navigator", "Screen", "IntersectionObserver", "MutationObserver", "ResizeObserver", "Request", "Response", "Headers", "FormData", "UrlSearchParams", "DomParser", "XmlHttpRequest", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "ProgressEvent"] }
js-sys = "0.3"
gloo-timers = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio-test = { workspace = true }