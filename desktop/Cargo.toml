[package]
name = "openrustbooks-desktop"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
description = "Desktop application for openrustbooks using Tauri"

# Android ビルドは `tauri android build` が `--lib` で cdylib を要求する。
# 既存 main.rs に mobile entry point が含まれるため、同一ソースを lib としても公開する。
[lib]
name = "openrustbooks_desktop"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

# main.rs を lib と共有した結果、`#[cfg(not(mobile))] fn main` が lib 側で
# dead_code になるため、package スコープで許容する。
[lints.rust]
dead_code = "allow"

[dependencies]
# Workspace dependencies
openrustbooks-core = { path = "../core", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "process"] }
directories = { workspace = true }
log = "0.4"
chrono = { workspace = true }

# Tauri
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-log = "2.0"
# WebdriverIO E2E 用。既定では無効、--features wdio で debug のみ登録。
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# command レベル test で tauri::test::mock_app() を使う（emit の検証に必要）。
tauri = { version = "2.0", features = ["test"] }
pretty_assertions = { workspace = true }
tokio-test = { workspace = true }
