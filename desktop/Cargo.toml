[package]
name = "openrustbooks-desktop"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Desktop application for openrustbooks using Tauri"

[dependencies]
# Workspace dependencies
openrustbooks-core = { path = "../core", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
directories = { workspace = true }

# Tauri
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-opener = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-clipboard = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-log = "2.0"
tauri-plugin-updater = "2.0"

# Platform-specific
#[cfg(target_os = "macos")]
objc = "0.2"

# Async
futures = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio-test = { workspace = true }