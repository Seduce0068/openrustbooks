[package]
name = "openrustbooks-desktop"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
description = "Desktop application for openrustbooks using Tauri"

[dependencies]
# Workspace dependencies
openrustbooks-core = { path = "../core", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
directories = { workspace = true }
log = "0.4"
chrono = { workspace = true }

# Tauri
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
# tauri-plugin-clipboard = "2.0"  # clipboard-rs がAndroid未対応のため一時無効化
# tauri-plugin-global-shortcut = { version = "2.0", target = "cfg(not(any(target_os = \"android\", target_os = \"ios\")))" }
tauri-plugin-notification = "2.0"
tauri-plugin-log = "2.0"
# WebdriverIO E2E 用。既定では無効、--features wdio で debug のみ登録。
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

# Platform-specific dependencies
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.0"

# Platform-specific
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Async
futures = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# command レベル test で tauri::test::mock_app() を使う（emit の検証に必要）。
tauri = { version = "2.0", features = ["test"] }
pretty_assertions = { workspace = true }
tokio-test = { workspace = true }
