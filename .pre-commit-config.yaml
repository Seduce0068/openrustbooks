# gitleaks を pre-commit の主軸として配置する。
# コミット履歴に入る前に検出・ブロックし、verify.sh / CI の check-secrets を最終ゲートとして併設する。
# 運用: pre-commit install && pre-commit autoupdate
# gitleaks hook は Go 製のため、初回構築時に Go toolchain が必要（pre-commit が
# hook リポジトリを clone して go install でビルドする）。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
