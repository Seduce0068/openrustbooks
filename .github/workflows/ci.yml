# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。共通側の基本ゲート
# （fmt / check / test / clippy）に加え、verify.sh と同じ静的検査を extra_gates で
# 実行する（rumdl-featureless / wasm32 core / wasm32 web）。さらに wasm-bindgen-test を
# Node 上で実行する wasm-pack test を末尾に置く（verify.sh の wasm-test と同じスクリプト）。
# no-external-font-refs / audit / trunk build + E2E は verify.sh 側のゲート。
# desktop を含むワークスペース全体を Linux 向けに検証するため、
# Tauri のビルド依存は apt_packages で渡す。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      rust_toolchain: 1.95.0
      audit: true
      apt_packages: |
        libwebkit2gtk-4.1-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        libxdo-dev
        libssl-dev
        patchelf
      wasm_targets: wasm32-unknown-unknown
      # rumdl が非 wasm で tikv-jemalloc-sys をビルドし、Tauri の成果物と
      # 合わせて GitHub Actions のディスクを超える。debuginfo を捨てて
      # 使用量を抑える。
      env_vars: |
        CARGO_PROFILE_DEV_DEBUG=0
        CARGO_PROFILE_TEST_DEBUG=0
        CARGO_INCREMENTAL=0
      extra_gates: |
        bash scripts/check-rumdl-featureless.sh
        bash scripts/check-version-consistency.sh
        cargo check -p openrustbooks-core --target wasm32-unknown-unknown --locked
        cargo check -p openrustbooks-web --target wasm32-unknown-unknown --locked
        bash scripts/ci-wasm-test.sh
