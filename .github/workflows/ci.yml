# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。共通側の基本ゲート
# （fmt / check / test / clippy）に加え、verify.sh と同じ静的検査を extra_gates で
# 実行する（no-external-font-refs / distribution-path / secrets /
# rumdl-featureless / dependency-hygiene / version / e2e-count / csp /
# updater-honesty / capability-scope / tauri-plugin-config / wasm32 core /
# wasm32 web）。さらに wasm-bindgen-test を
# Node 上で実行する wasm-pack test を末尾に置く（verify.sh の wasm-test と同じスクリプト）。
# audit / trunk build + E2E / WDIO / 配布保持は verify.sh 側のゲート。
# gitleaks は共通 workflow 側または extra_gates 内（チェックサム付きバイナリ / go install）で
# 導入可能。現状は未導入のため、extra_gates の最終ゲート（末尾）で存在検査を行い
# fail-closed とする。未導入でもそれ以外の静的ゲート / wasm check / wasm-test は
# すべて実行される。docs/runbook-verified-build.md に記載。
# desktop を含むワークスペース全体を Linux 向けに検証するため、
# Tauri のビルド依存は apt_packages で渡す。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      rust_toolchain: 1.95.0
      audit: true
      apt_packages: |
        libwebkit2gtk-4.1-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        libxdo-dev
        libssl-dev
        patchelf
      wasm_targets: wasm32-unknown-unknown
      # rumdl が非 wasm で tikv-jemalloc-sys をビルドし、Tauri の成果物と
      # 合わせて GitHub Actions のディスクを超える。debuginfo を捨てて
      # 使用量を抑える。
      env_vars: |
        CARGO_PROFILE_DEV_DEBUG=0
        CARGO_PROFILE_TEST_DEBUG=0
        CARGO_INCREMENTAL=0
      extra_gates: |
        bash scripts/check-no-external-font-refs.sh
        # 無引数でも自己検査（repo 内 / 相対 / .. / repo 内 symlink の拒否と
        # manifest 形式の正負）を実行するため、恒真なゲートにはならない。
        bash scripts/check-distribution-path.sh
        bash scripts/check-rumdl-featureless.sh
        bash scripts/check-dependency-hygiene.sh
        bash scripts/check-version-consistency.sh
        bash scripts/check-e2e-count-consistency.sh
        bash scripts/check-csp-consistency.sh
        bash scripts/check-tauri-plugin-config.sh
        bash scripts/check-updater-honesty.sh
        bash scripts/check-capability-scope.sh
        cargo check -p openrustbooks-core --target wasm32-unknown-unknown --locked
        cargo check -p openrustbooks-web --target wasm32-unknown-unknown --locked
        bash scripts/ci-wasm-test.sh
        # gitleaks は最終ゲート。未導入ならここで fail-closed にし、共有 workflow
        # または extra_gates 内で導入する選択肢は docs/runbook-verified-build.md を参照。
        if command -v gitleaks >/dev/null 2>&1; then
          bash scripts/check-secrets.sh
        else
          echo "ERROR: gitleaks is required; install it in the common workflow or via extra_gates (checksummed binary / go install). Currently missing: fail-closed." >&2
          exit 1
        fi
