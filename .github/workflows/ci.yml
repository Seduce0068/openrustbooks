# 個人リポジトリ共通の再利用可能ワークフロー
# （onoderakeita/workflows の rust-gates.yml）へ委譲する。ローカルの
# 5 ゲート（fmt / check / test / clippy / wasm32）と同じ検証を共通側が
# 実行する。desktop を含むワークスペース全体を Linux 向けに検証するため、
# Tauri のビルド依存は apt_packages で渡す。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: onoderakeita/workflows/.github/workflows/rust-gates.yml@v1
    with:
      apt_packages: |
        libwebkit2gtk-4.1-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        libxdo-dev
        libssl-dev
        patchelf
      wasm_targets: wasm32-unknown-unknown
      extra_gates: |
        cargo check -p openrustbooks-core --target wasm32-unknown-unknown --locked
        cargo check -p openrustbooks-web --target wasm32-unknown-unknown --locked
