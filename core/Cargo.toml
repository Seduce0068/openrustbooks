[package]
name = "openrustbooks-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Shared core library for openrustbooks: document models, I/O abstraction, AI Markdown pipeline"

[lib]
name = "openrustbooks_core"
crate-type = ["rlib"]

[dependencies]
# Explicit serde with derive macro to ensure proc-macro is available
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
pulldown-cmark = { version = "0.12", features = ["simd"] }
comrak = { version = "0.28", features = ["default"] }
rumdl = { version = "0.2", default-features = true }
async-openai = "0.30"
async-trait = "0.1"
tiktoken-rs = "0.4"
similar = "2.7.0"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "5.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1.5"

# Additional core dependencies
url = "2.5"
walkdir = "2.5"
ignore = "0.4"
once_cell = "1.19"
parking_lot = "0.12"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "Blob", "File", "FileReader", "Url", "Performance", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlDivElement", "HtmlSpanElement", "HtmlAnchorElement", "Event", "MouseEvent", "KeyboardEvent", "InputEvent", "DragEvent", "FocusEvent", "ClipboardEvent", "SubmitEvent", "Storage", "History", "Location", "Navigator", "Screen", "IntersectionObserver", "MutationObserver", "ResizeObserver", "Request", "Response", "Headers", "FormData", "UrlSearchParams", "DomParser", "XmlHttpRequest", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "ProgressEvent"] }
js-sys = "0.3"
gloo-timers = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio-test = { workspace = true }