[package]
name = "openrustbooks-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Shared core library for openrustbooks: document models, I/O abstraction, AI Markdown pipeline"

[lib]
name = "openrustbooks_core"
crate-type = ["rlib"]

[dependencies]
# Explicit serde with derive macro to ensure proc-macro is available
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
anyhow = "1.0"
pulldown-cmark = { version = "0.13", features = ["simd"] }
comrak = { version = "0.59", default-features = false }
async-trait = "0.1"
similar = "3.0"
futures = "0.3"
bytes = "1.5"

# ZIP アーカイブの読み取り専用閲覧。pure Rust のみを選び、wasm32 でもビルドする。
# `deflate-flate2` 単独では flate2 のバックエンドが未指定でビルドできないため
# `deflate-flate2-zlib-rs` (pure Rust の zlib-rs) を指定する。
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# EPUB 解析用の XML パーサ。pure Rust で wasm32 でもビルドする。
# 既定機能は空なので、そのまま `default-features = false` で使う。
quick-xml = { version = "0.42", default-features = false }

# Additional core dependencies
url = { version = "2.5", features = ["serde"] }
walkdir = "2.5"
ignore = "0.4"
once_cell = "1.19"
parking_lot = "0.13"
serde_norway = "0.9"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1.8", features = ["serde", "v4", "js"] }
toml = "1"

# Native-only dependencies: async runtime, HTTP clients, OS integration.
# These must not be built for wasm32, where mio/net/process are unavailable.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.40", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tiktoken-rs = "0.12"
async-openai = { version = "0.42", features = ["chat-completion"] }
figment = { version = "0.10", features = ["toml", "env"] }
directories = "6.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
# `native` pulls tokio/tower-lsp (LSP server) and OS file watching.
rumdl = { version = "0.3", default-features = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Lint in-process. Featureless on purpose: `native` pulls tower-lsp/tokio/notify
# and `wasm` would export rumdl's own `#[wasm_bindgen(start)] init`, which
# collides with the core's wasm-bindgen surface.
rumdl = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
# Required by `#[wasm_bindgen]` on async functions.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "Node", "EventTarget", "Blob", "File", "FileReader", "Url", "Performance", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlDivElement", "HtmlSpanElement", "HtmlAnchorElement", "Event", "MouseEvent", "KeyboardEvent", "InputEvent", "DragEvent", "FocusEvent", "ClipboardEvent", "SubmitEvent", "Storage", "History", "Location", "Navigator", "Screen", "IntersectionObserver", "MutationObserver", "ResizeObserver", "Request", "Response", "Headers", "FormData", "UrlSearchParams", "DomParser", "XmlHttpRequest", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "ProgressEvent"] }
js-sys = "0.3"
gloo-timers = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio-test = { workspace = true }